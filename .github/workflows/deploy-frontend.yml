name: Deploy to Vercel - FrontEnd

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  VERCEL_CLI_VERSION: '66.2.0'

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Production deploys only from main, even though the workflow can be
    # dispatched from any branch.
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # The CLI reads the token from the VERCEL_TOKEN env var, so it never
      # appears on a command line.
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production

      - name: Build Project
        run: vercel build --prod
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Deployment Successful!" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to: $URL" >> "$GITHUB_STEP_SUMMARY"
